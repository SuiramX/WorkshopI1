services:
  web:
    build:
      context: ./Web
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      VIDEO_HOST: video
      VIDEO_PORT: 8765
      WS_AUTH_TOKEN: ${WS_AUTH_TOKEN:-sentinel_ws_secure_stream_token_9x7k2}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      - video
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: [ "CMD", "mosquitto_sub", "-t", "$$sys/#", "-C", "1", "-i", "healthcheck", "-W", "3" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_x}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secure_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-init:
    image: python:3.11-slim
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_x}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secure_pass}
    volumes:
      - ./init_postgres_standalone.py:/app/init_postgres_standalone.py
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir psycopg2-binary python-dotenv && python init_postgres_standalone.py"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  video:
    build:
      context: ./WebSocket
      dockerfile: Dockerfile
    environment:
      PORT: 8765
      STREAM_MODE: ${STREAM_MODE:-camera} # Mode: 'camera' (direct raw stream) or 'ia' (IA-annotated stream)
      DEVICE: ${VIDEO_DEVICE:-auto}
      CAMERA_NAME: ${CAMERA_NAME:-C920}
      FPS: ${FPS:-25}
      JPEG_QUALITY: ${JPEG_QUALITY:-65}
      WS_AUTH_TOKEN: ${WS_AUTH_TOKEN:-sentinel_ws_secure_stream_token_9x7k2}
      MAX_CLIENTS: 5
    # Port 8765 is isolated inside the Docker network (only readable by 'web' server)
    # Uncomment only for direct localhost debugging:
    # ports:
    #   - "127.0.0.1:${VIDEO_PORT:-8765}:8765"
    device_cgroup_rules:
      - "c 81:* rmw"
    volumes:
      - /dev:/dev
      - /sys:/sys:ro
    restart: unless-stopped

  ia:
    build:
      context: ./IA
      dockerfile: Dockerfile
    environment:
      STREAM_SERVER_URL: ws://video:8765/publish
      WS_AUTH_TOKEN: ${WS_AUTH_TOKEN:-sentinel_ws_secure_stream_token_9x7k2}
      API_ALERTS_URL: http://api:8080/api/v1/alerts
      DEVICE: ${VIDEO_DEVICE:-auto}
      CAMERA_NAME: ${CAMERA_NAME:-C920}
      FPS: ${FPS:-25}
      JPEG_QUALITY: ${JPEG_QUALITY:-65}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.50}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.40}
      ENABLE_GUI: "false"
    device_cgroup_rules:
      - "c 81:* rmw"
    volumes:
      - /dev:/dev
      - /sys:/sys:ro
      - ./IA/authorized_faces:/app/authorized_faces
      - ./IA/blacklist:/app/blacklist
      - ./IA/models:/app/models
    depends_on:
      - video
    restart: unless-stopped

  api:
    profiles: [ "api" ]
    build:
      context: ./API/actix-sentinel
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_secure_pass}@db:5432/${POSTGRES_DB:-sentinel_x}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      mqtt:
        condition: service_started
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:
