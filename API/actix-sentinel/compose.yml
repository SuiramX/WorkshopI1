services:
  db:
    image: 'postgres:18.6'
    ports:
      - 5432:5432
    env_file:
      - .env
    networks:
      - postgres-network
  
  sentinel-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # DB_HOST: db
      DB_PORT: 5432
      DB_NAME: mydatabase
      DB_USER: postgres
      DB_PASSWORD: mysecretpassword
    networks:
      - postgres-network
    # depends_on:
    #   db:
    #     condition: service_healthy

networks: 
  postgres-network:
    driver: bridge